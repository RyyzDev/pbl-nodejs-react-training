# nama dari workflownya
name: CI/CD Workflow

# trigger
on:
  # push: akan dieksekusi jika seseorang melakukan push ke branch dengan nama branch dibawah (otomatis)
  push:
    branches: [ "nama-branch" ]
  # Hanya berjalan saat PR ditutup (butuh tutup pull request di branch main (manual))
  pull_request:
    branches:
      - main
    types: [closed] 

# jobs: kumpulan pekerjaan yang akan dieksekusi saat workflow di trigger
jobs:
  # nama job pertama : (flow pertama) unit testing dan feature testing aplikasi kita
  testing-app:
    # runs-on : akan di jalankan di runtime ubuntu
    runs-on: ubuntu-latest
    # env: untuk memasukkan env kita ke runtime
    env:
        PASSPORT_PASSWORD_CLIENT_ID: ${{ secrets.VARIABEL_ENV_DISINI }}
    # services : service/program/tool yang akan dijalankan juga ketika job berjalan (dengan aturan pada docker compose)
    services:
      # nama service
      mysql:
        #image service
        image: image:9.0
        # env service
        env:
          VARIABEL_ENV_SERVICE_DISINI: root
        # port service
        ports:
          - 3306:3306
        # command
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    # steps : aturan atau langkah langkah untuk menjalankan job
    # berikut contoh ketika laravel, harus menginstall ekstensi dan/atau dependensi yang dibutuhkan oleh aplikasi kita 
    steps:
    # deklarasi tool semua nama tool ada di dokumentasi github
    # nama tool
    - name: Checkout Code
      # image tool yang kita pakai
      uses: actions/checkout@v4
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      # with : tempat mengatur extensi yang dibutuhkan
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, iconv, bcmath, mysql, pdo_mysql, intl
        coverage: none
    - name: Install Composer Dependencies
      # eksekusi command
      run: composer install
    - name: Prepare Laravel Environment        
      run: |
        cp .env.example .env
        php artisan key:generate
    - name: Run Migrations
      run: php artisan migrate
      # webhook jika job ini gagal di jalankan
    - name: Send Webhook on Failure
      # kondisi jika gagal
      if: failure()
      run: |
        curl -X POST -H 'Content-Type: application/json' \
          -d '{"status": "failed", "repo": "${{ github.repository }}", "run_id": "${{ github.run_id }}"}' \
          ${{ secrets.WEBHOOK_URL }}
  
  # nama job kedua : (flow kedua) build image dan push ke docker hub
  build-push:
    runs-on: ubuntu-latest
    # needs : job ini hanya akan dieksekusi saat job dengan nama yang sama berhasil dieksekusi
    needs: testing-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/nama-tag-image:latest

  # nama job ketiga : (flow ketiga) deploy ke server
  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          # Script atau perintah yang akan dijalankan saat berhasil masuk SSH
          script: |
            cd ~/www/apps
            docker compose pull
            docker compose up -d
            docker image prune -f